<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Expense Split</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Geist:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/app.css" />

  <script>
    // Runs before first paint so there's no flash of the wrong theme.
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="app-header">
    <div class="app-header__inner">
      <a href="#/" class="font-display app-header__title">💸 Expense Split</a>
      <button class="theme-toggle" id="theme-toggle-btn" aria-label="Toggle dark mode">
        🌓
      </button>
    </div>
  </header>

  <main class="container" id="app">
    <p class="center-note">Loading&hellip;</p>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
